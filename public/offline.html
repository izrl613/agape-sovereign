<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agape Sovereign — Offline</title>
  <style>
    :root {
      --bg: #050a0f;
      --surface: #0a1520;
      --cyan: #00f5ff;
      --magenta: #ff00aa;
      --orange: #ff6b00;
      --text: #c8d8e8;
      --muted: #4a6a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }
    .container {
      position: relative;
      text-align: center;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
    }
    .glyph {
      font-size: 4rem;
      line-height: 1;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 0 24px var(--cyan));
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 24px var(--cyan)); opacity: 1; }
      50% { filter: drop-shadow(0 0 48px var(--magenta)); opacity: 0.85; }
    }
    .badge {
      display: inline-block;
      font-family: 'Courier New', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      border-radius: 2px;
      padding: 0.25rem 0.6rem;
      margin-bottom: 1rem;
      opacity: 0.75;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: transparent;
      color: var(--cyan);
      border: 1px solid var(--cyan);
      border-radius: 6px;
      padding: 0.65rem 1.5rem;
      font-size: 0.875rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .retry-btn:hover {
      background: rgba(0, 245, 255, 0.08);
      box-shadow: 0 0 20px rgba(0, 245, 255, 0.25);
    }
    .status-line {
      margin-top: 2rem;
      font-family: 'Courier New', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--orange);
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="glyph">⊘</div>
    <div class="badge">AGAPE-SOVEREIGN · PWA SHELL</div>
    <h1>You're Offline</h1>
    <p>
      The Sovereign Identity Monitor needs a connection to scan and report.
      Your cached data remains encrypted and secure locally.
    </p>
    <button class="retry-btn" onclick="window.location.reload()">
      ↺ &nbsp;Retry Connection
    </button>
    <div class="status-line">NETWORK LAYER UNAVAILABLE · LOCAL VAULT INTACT</div>
  </div>
</body>
</html>
