- release_tracks: [GA, ALPHA]
  hints:
    read_only: true

  help_text:
    brief: List the revisions of an OS policy assignment
    description: |
      List the revisions of an OS policy assignment
      ## EXAMPLES

      To list the revisions of an OS policy `my-assignment` in location `us-central1-a`:

        $ {command} my-assignment --location=us-central1-a

  command_type: LIST
  request:
    collection: osconfig.projects.locations.osPolicyAssignments
    regional_endpoint_compatibility: SUPPORTED
    disable_pagination: true
    method: listRevisions
    ALPHA:
      api_version: v1alpha
    GA:
      api_version: v1

  arguments:
    resource:
      help_text: |
        Short ID or fully qualified resource identifier of the OS policy
        assignment for which to list revisions. A fully qualified identifier is
        structured as a resource path (for example,
        `projects/acme-corp-prod/locations/us-central1-a/osPolicyAssignments/base-security-policy`).
        If only the short ID is provided (for example, `base-security-policy`),
        the target project and location are inferred from the active gcloud
        configuration or must be specified using command-line flags.
      spec: !REF googlecloudsdk.command_lib.compute.os_config.resources:os_policy_assignment

  response:
    id_field: name
    result_attribute: osPolicyAssignments

  output:
    format: |
      table(
         name.basename():label=ASSIGNMENT_ID,
         rollout_state,
         revision_create_time.date("%Y-%m-%dT%H:%M:%SZ"),
         revision_id
       )
