- release_tracks: [GA, ALPHA]
  hints:
    read_only: false

  help_text:
    brief: Delete an OS policy assignment
    description: |
      Delete an OS policy assignment
      ## EXAMPLES

      To delete an OS policy `my-assignment` in location `us-central1-a`:

        $ {command} my-assignment --location=us-central1-a

  request:
    collection: osconfig.projects.locations.osPolicyAssignments
    regional_endpoint_compatibility: SUPPORTED
    ALPHA:
      api_version: v1alpha
    GA:
      api_version: v1

  async:
    collection: osconfig.projects.locations.osPolicyAssignments.operations
    ALPHA:
      api_version: v1alpha
    GA:
      api_version: v1

  arguments:
    resource:
      help_text: |
        Unique ID or fully qualified resource identifier of the OS policy
        assignment to delete. The identifier can be specified as a simple
        string representing the short name (for example, `policy-assignment-1`)
        or as a complete hierarchical resource path (for example,
        `projects/my-project/locations/us-central1-a/osPolicyAssignments/policy-assignment-1`).
      spec: !REF googlecloudsdk.command_lib.compute.os_config.resources:os_policy_assignment
