release_tracks: [ALPHA]
hidden: true
hints:
  read_only: true

help_text:
  brief: |
    Export a cost per token policy.
  description: |
    Export a cost per token policy to a YAML file.
  examples: |
    To export cost per token policy `my-cost-policy` in location `global` to a YAML file, run:

      $ {command} my-cost-policy --destination=my-cost-policy.yaml --location=global

request:
  collection: ratelimiting.projects.locations.costPerTokenPolicies
  api_version: v1
  regional_endpoint_compatibility: SUPPORTED

arguments:
  resource:
    spec: !REF googlecloudsdk.command_lib.rate_limiting.resources:projects_locations_cost_per_token_policies
    help_text: |
      Name of the cost per token policy to export.
