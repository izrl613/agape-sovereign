release_tracks: [ALPHA]
hidden: true
hints:
  read_only: false

help_text:
  brief: |
    Import a token aggregation policy.
  description: |
    Import a token aggregation policy from a YAML file.
  examples: |
    To import token aggregation policy `my-policy` in location `global` from a YAML file, run:

      $ {command} my-policy --source=my-policy.yaml --location=global

request:
  collection: ratelimiting.projects.locations.tokenAggregationPolicies
  api_version: v1
  regional_endpoint_compatibility: SUPPORTED

arguments:
  resource:
    spec: !REF googlecloudsdk.command_lib.rate_limiting.resources:projects_locations_token_aggregation_policies
    help_text: |
      Name of the token aggregation policy to import.

async:
  collection: ratelimiting.projects.locations.operations

import:
  abort_if_equivalent: true
  create_if_not_exists: true
  create_request:
    collection: ratelimiting.projects.locations.tokenAggregationPolicies
    api_version: v1
    regional_endpoint_compatibility: SUPPORTED
    method: create
