- release_tracks: [ALPHA, GA]
  hints:
    read_only: false
  help_text:
    brief: Update the Skill encryption spec of a location.
    description: |
      Set or change the Cloud KMS key that is used to encrypt Skills in a
      project and location.

      The Skill encryption spec can only be updated while no Skills exist in
      the project and location.

      Customer-managed encryption keys are supported only for Skills in the
      `us` and `eu` locations. The key must be in the matching Cloud KMS
      location: `us` for Skills in `us`, and `europe` for Skills in `eu`.

      Before the key is set, the Agent Registry service agent of the project,
      `service-PROJECT_NUMBER@gcp-sa-agentregistry.iam.gserviceaccount.com`,
      must have the Cloud KMS CryptoKey Encrypter/Decrypter role
      (`roles/cloudkms.cryptoKeyEncrypterDecrypter`) on the key. The update
      fails if the key doesn't exist, isn't enabled, or can't be used by the
      service agent.
    examples: |
      To encrypt Skills in location `us` with the Cloud KMS key
      `projects/my-project/locations/us/keyRings/my-key-ring/cryptoKeys/my-key`,
      run:

        $ {command} --location=us --kms-key=projects/my-project/locations/us/keyRings/my-key-ring/cryptoKeys/my-key

  request:
    ALPHA:
      api_version: v1alpha
    GA:
      api_version: v1
    collection: agentregistry.projects.locations
    method: updateSkillEncryptionSpec
    display_resource_type: skill encryption spec
    regional_endpoint_compatibility: SUPPORTED
    modify_request_hooks:
    - googlecloudsdk.command_lib.agent_registry.util:SetSkillEncryptionSpecName

  arguments:
    resource:
      help_text: The location of the Skill encryption spec to update.
      spec: !REF googlecloudsdk.command_lib.agent_registry.resources:location
      is_positional: false
    params:
    - arg_name: kms-key
      api_field: skillEncryptionSpec.cryptoKeyName
      required: true
      help_text: |
        Resource name of the Cloud KMS key that is used to encrypt Skills in
        the location, in the format
        `projects/PROJECT_ID/locations/LOCATION/keyRings/KEY_RING/cryptoKeys/KEY`.

  async:
    ALPHA:
      api_version: v1alpha
    GA:
      api_version: v1
    collection: agentregistry.projects.locations.operations
    extract_resource_result: false
    result_attribute: response
