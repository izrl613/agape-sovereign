$schema: "http://json-schema.org/draft-06/schema#"

title: networkservices v1alpha1 UrlRewrite export schema
description: A gcloud export/import command YAML validation schema.
type: object
additionalProperties: false
properties:
  COMMENT:
    type: object
    description: User specified info ignored by gcloud import.
    additionalProperties: false
    properties:
      template-id:
        type: string
      region:
        type: string
      description:
        type: string
      date:
        type: string
      version:
        type: string
  UNKNOWN:
    type: array
    description: Unknown API fields that cannot be imported.
    items:
      type: string
  hostRewrite:
    description: |-
      Before forwarding the request to the selected origin, the request's host
      header is replaced with contents of `host_rewrite`. The host value must be
      between 1 and 255 characters.
    type: string
  pathPrefixRewrite:
    description: |-
      Before forwarding the request to the selected origin, the matching portion
      of the request's path is replaced by `path_prefix_rewrite`. If set, the
      path value must start with a `/` and be between 1 and 1024 characters long
      (inclusive). `path_prefix_rewrite` can only be used when all of a route's
      `match_rules` set `prefix_match` or `full_path_match`. Only one of
      `path_prefix_rewrite`, `path_template_rewrite`, and `regex_rewrite` can be
      set.
    type: string
  pathTemplateRewrite:
    description: |-
      Before forwarding the request to the selected origin, if the request
      matched a `path_template_match`, the matching portion of the request's
      path is rewritten using the pattern set by `path_template_rewrite`.
      `path_template_rewrite` must be between 1 and 255 characters (inclusive),
      must start with a `/`, and must only use variables captured by the route's
      `path_template_match`. `path_template_rewrite` can only be used when all
      of a route's `match_rules` set `path_template_match`. Only one of
      `path_prefix_rewrite`, `path_template_rewrite`, and `regex_rewrite` can be
      set.
    type: string
  regexRewrite:
    description: |-
      Before forwarding the request to the selected origin, if the request
      matched a `regex_match`, the matching portion of the request's path is
      rewritten using the pattern set by `regex_rewrite`. `regex_rewrite` must
      be between 1 and 1024 characters (inclusive), must start with a `/`, must
      conform to RE2 rewrite specifications, and must reference every capture
      group defined in the route's `regex_match`, and no others. `regex_rewrite`
      can only be used when all of a route's `match_rules` set `regex_match`.
      Only one of `path_prefix_rewrite`, `path_template_rewrite`, and
      `regex_rewrite` can be set.
    type: string
