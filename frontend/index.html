<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agape Sovereign AI — Digital Identity Protection Platform</title>
    <!-- Canonical + Indexing -->
    <link rel="canonical" href="https://sovereign.nyc/" />
    <meta name="robots" content="index,follow" />
    <meta name="description" content="Agape Sovereign AI is an advanced privacy and digital identity protection platform. It scans, monitors, and defends your personal data across 16 identity vectors." />
    <meta name="application-name" content="Agape Sovereign AI" />

    <!-- Open Graph -->
    <meta property="og:title" content="Agape Sovereign AI — Digital Identity Protection" />
    <meta property="og:description" content="Advanced privacy and digital identity protection platform with 16-vector identity scanning, breach monitoring, and client-side AES-GCM encryption." />
    <meta property="og:url" content="https://sovereign.nyc/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Agape Sovereign AI" />
    <meta property="og:image" content="https://sovereign.nyc/agape-logo-oauth.png" />

    <!-- Structured data for Google search / OAuth branding verification -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Agape Sovereign AI",
      "url": "https://sovereign.nyc/",
      "description": "Advanced privacy and digital identity protection platform with 16-vector identity scanning, breach monitoring, and client-side AES-GCM encryption.",
      "applicationCategory": "SecurityApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Organization",
        "name": "Agape Sovereign AI",
        "url": "https://sovereign.nyc/",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "url": "https://sovereign.nyc/contact"
        }
      }
    }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'enclave-bg': '#0B1020',
              'enclave-surface': '#0F172A',
              'enclave-card': '#111A33',
              'neon-magenta': '#FF2E9F',
              'neon-cyan': '#00D4FF',
              'neon-orange': '#FF7A18',
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            keyframes: {
              'border-flow': {
                '0%, 100%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
              },
              'pulse-slow': {
                '0%, 100%': { opacity: '0.9', transform: 'scale(1)' },
                '50%': { opacity: '0.6', transform: 'scale(0.995)' },
              }
            },
            animation: {
              'border-flow': 'border-flow 6s ease infinite',
              'pulse-slow': 'pulse-slow 4s ease-in-out infinite',
            }
          }
        }
      }
    </script>

        <style>
      /* Custom scrollbars with neon hue */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0B1020;
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, #FF2E9F, #00D4FF);
        border-radius: 4px;
      }
      /* Prevent text selection flicker */
      .neon-border-wrapper {
        background: linear-gradient(90deg, #FF2E9F, #00D4FF, #FF7A18, #FF2E9F);
        background-size: 300% 300%;
      }
    </style>
  </head>
  <body class="bg-[#0B1020] text-slate-100 min-h-screen selection:bg-[#FF2E9F] selection:text-white antialiased font-sans overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  <script type="module" src="/index.js"></script></body>
</html>
