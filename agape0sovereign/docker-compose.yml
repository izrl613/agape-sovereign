version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agape-sovereign-pwa
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://agape_user:agape_pass_2026@postgres:5432/agape_sovereign?schema=public
      - JWT_SECRET=agape-sovereign-production-secret-2026
      - BREACH_API_URL=https://xposedornot.com/api
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: agape-sovereign-db
    restart: always
    environment:
      - POSTGRES_USER=agape_user
      - POSTGRES_PASSWORD=agape_pass_2026
      - POSTGRES_DB=agape_sovereign
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agape_user -d agape_sovereign"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local