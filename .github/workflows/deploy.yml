name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Lint & Typecheck Frontend
        run: npm run typecheck

      - name: Build Frontend
        run: npm run build:frontend

      - name: Install Functions Dependencies
        run: npm --prefix functions ci

      - name: Lint & Build Functions
        run: npm --prefix functions run lint && npm --prefix functions run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGAPE_SOVEREIGN }}

      - name: Deploy to Firebase (agape-sovereign)
        run: npx firebase-tools deploy --project agape-sovereign --only hosting,functions,firestore,storage
