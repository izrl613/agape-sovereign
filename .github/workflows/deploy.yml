name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node >=22 is REQUIRED: @google-cloud/firestore (firebase-admin
          # dep) is optional with engines>=22, so npm ci on Node 20
          # silently omits it and firebase analysis cannot find it.
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      # working-directory, NOT --prefix: inside a workspaces repo,
      # `npm --prefix functions ci` installs the ROOT tree, leaving
      # functions/node_modules without @google-cloud/firestore and
      # firebase's codebase analysis fails ("Cannot find module").
      - name: Install Functions Dependencies
        working-directory: functions
        run: npm ci

      - name: Build Functions
        working-directory: functions
        run: npm run build

      # firebase-functions params need values in non-interactive mode.
      # Values come from GitHub Secrets when the owner sets them
      # (PASSKEY_COOKIE_SECRET / GEMINI_API_KEY); empty = documented
      # runtime fallbacks. This file is gitignored and only exists in CI.
      - name: Write functions env params file
        shell: bash
        env:
          PASSKEY_COOKIE_SECRET: ${{ secrets.PASSKEY_COOKIE_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          {
            echo "PASSKEY_COOKIE_SECRET=${PASSKEY_COOKIE_SECRET}"
            echo "COOKIE_SECRET=${COOKIE_SECRET}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
          } > functions/.env.agape-sovereign

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGAPE_SOVEREIGN }}

      # Split on purpose: the CI service account currently lacks the
      # Firebase Rules Admin role, so a combined deploy dies in the
      # Firestore phase BEFORE Functions ship (403 on
      # firebaserules.googleapis.com:test). Hosting+Functions must go
      # live regardless; rules deploy is a separate, loudly-warned step
      # until the owner grants roles/firebaserules.admin (see
      # docs/OWNER_SETUP_ZERO_COST.md). Remove continue-on-error then.
      - name: Deploy app (Hosting + Functions)
        shell: bash
        run: |
          set -o pipefail
          npx firebase-tools deploy --only hosting,functions --non-interactive 2>&1 | tee /tmp/firebase-deploy.log || {
            echo '## firebase deploy — last 120 log lines' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 /tmp/firebase-deploy.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Also emit the CLI's own error lines as annotations (API-readable).
            grep -aiE "error:|failed|unable|permission|denied|invalid|not found" /tmp/firebase-deploy.log | tail -n 10 | while IFS= read -r line; do echo "::error::FIREBASE-DEPLOY: $line"; done
            tail -n 5 /tmp/firebase-deploy.log | while IFS= read -r line; do echo "::error::FIREBASE-DEPLOY-TAIL: $line"; done
            exit 1
          }


      - name: Deploy security rules (Firestore + Storage)
        continue-on-error: true
        shell: bash
        run: |
          if npx firebase-tools deploy --only firestore,storage --non-interactive; then
            echo "Firestore/Storage rules deployed."
          else
            echo "::warning::RULES NOT DEPLOYED — CI service account needs roles/firebaserules.admin on project agape-sovereign (one-time owner grant, see docs/OWNER_SETUP_ZERO_COST.md). Hosting + Functions ARE live; production still runs the previously deployed rules."
          fi
