name: Deploy to Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Install Functions Dependencies
        run: npm --prefix functions ci

      - name: Build Functions
        run: npm --prefix functions run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGAPE_SOVEREIGN }}

      - name: Deploy to Firebase
        shell: bash
        run: |
          set -o pipefail
          npx firebase-tools deploy --only hosting,functions,firestore --non-interactive 2>&1 | tee /tmp/firebase-deploy.log || {
            echo '## firebase deploy — last 120 log lines' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 /tmp/firebase-deploy.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Also emit the CLI's own error lines as annotations (API-readable).
            grep -aiE "error:|failed|unable|permission|denied|invalid|not found" /tmp/firebase-deploy.log | tail -n 10 | while IFS= read -r line; do echo "::error::FIREBASE-DEPLOY: $line"; done
            tail -n 5 /tmp/firebase-deploy.log | while IFS= read -r line; do echo "::error::FIREBASE-DEPLOY-TAIL: $line"; done
            exit 1
          }

