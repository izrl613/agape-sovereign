# Agape Sovereign — Timeline Sync Workflow
# Runs daily to keep GitHub milestones, issues, and Project #2
# in sync with the canonical TIMELINE.md.
#
# Also triggered manually via workflow_dispatch.
#
# Notes:
# - main is branch-protected; this workflow does NOT push TIMELINE.md edits.
# - Optional repo secret TIMELINE_SYNC_TOKEN (classic PAT with repo + project)
#   enables Projects V2 linking; otherwise milestones/issues still sync.

name: Timeline Sync

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print actions without creating)'
        required: false
        default: 'false'
        type: boolean

jobs:
  sync-timeline:
    name: Sync Project Timeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Timeline Sync Agent
        env:
          GITHUB_TOKEN: ${{ secrets.TIMELINE_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          TIMELINE_SKIP_FILE_WRITE: '1'
        run: |
          python Projects/Timeline/sync_agent.py
