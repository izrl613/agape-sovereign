# Live Hosting + authApi on push to main.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGAPE_SOVEREIGN }}
          channelId: live
          projectId: agape-sovereign
  deploy_auth_api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGAPE_SOVEREIGN }}
      - name: Write functions env params file
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PASSKEY_COOKIE_SIGNING_KEY: ${{ secrets.PASSKEY_COOKIE_SIGNING_KEY }}
        run: |
          {
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "PASSKEY_COOKIE_SIGNING_KEY=${PASSKEY_COOKIE_SIGNING_KEY}"
          } > functions/.env.agape-sovereign
      - name: Build and deploy authApi
        working-directory: functions
        run: |
          npm ci
          npm run lint
          npm run build
          cd ..
          npx firebase-tools deploy --only functions:authApi --project agape-sovereign --non-interactive --force
