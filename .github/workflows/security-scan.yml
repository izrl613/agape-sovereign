name: Sovereign Security Audit

# Kept in lockstep with the Compliance Gate's secret scan:
# gitleaks-action v3 + full history + the repo .gitleaks.toml
# (v2 ignored the current config semantics and stayed red on main).
# The old `grep -r "secret"` steps could never fail and only added
# noise; real coverage comes from gitleaks + the compliance workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
