name: Sovereign Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks on Current Tree
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact
          rm -f ./gitleaks
      - name: Verify Zero Committed Credential Files
        run: |
          VIOLATIONS=$(git ls-files | grep -E '(\.env$|\.env\.local$|service[-_]account.*\.json$|credentials\.json$)' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Committed credential file detected: $VIOLATIONS"
            exit 1
          fi
          echo "Zero committed credential files."
