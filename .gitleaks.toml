# ============================================================
# Gitleaks Configuration — agape-sovereign / sovereign.nyc
# 2026 Compliance: ECRA, CPRA, NIST CSF 2.0
# ============================================================

title = "agape-sovereign gitleaks config"

[extend]
  useDefault = true

[allowlist]
  description = "Allowlist Firebase public client SDK manifests and template env files (non-secret client identifiers)"
  paths = [
    '''(^|/)firebase-config\.json$''',
    '''(^|/)firebase-applet-config\.json$''',
    '''(^|/)firebase-blueprint\.json$''',
    '''(^|/)\.env\.example$''',
    '''(^|/)\.env\.sample$''',
    '''(^|/)\.env\.template$''',
  ]
