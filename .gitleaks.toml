# ============================================================
# Gitleaks Configuration — agape-sovereign / sovereign.nyc
# 2026 Compliance: ECRA, CPRA, NIST CSF 2.0
# ============================================================

title = "agape-sovereign gitleaks config"

[extend]
  useDefault = true

[[allowlists]]
  description = "Exclude .git internals and allowlist Firebase public client SDK manifests and template env files"
  paths = [
    '''(^|/)\.git(/|$)''',
    '''(^|/)node_modules(/|$)''',
    '''firebase-config\.json''',
    '''firebase-applet-config\.json''',
    '''firebase-blueprint\.json''',
    '''\.env\.(example|sample|template|test|ci)''',
  ]
  regexes = [
    '''YOUR_GOOGLE_CLIENT_SECRET''',
    '''agape-sovereign-default-secret''',
    '''agape-sovereign-dev-cookie-secret''',
  ]
