# ============================================================
# Gitleaks Configuration — agape-sovereign / sovereign.nyc
#
# Previous revision defined a custom [[rules]] entry matching the
# Firebase web-key pattern, which CREATED detections instead of
# allowlisting them and kept Secret Leak Detection red on main.
# This revision allowlists only the one public web key.
#
# Firebase Web API keys are public client identifiers, not secrets:
# https://firebase.google.com/docs/projects/api-keys
# Access control comes from Firestore/Storage rules + API key
# restrictions in Google Cloud Console — not from hiding the key.
# Any OTHER AIza… key, and all real credential patterns, still fail.
# ============================================================

title = "agape-sovereign gitleaks config"

[allowlist]
  description = "Public Firebase web config + template env files (no real secrets)"

  paths = [
    '''\.env\.example$''',
    '''\.env\.sample$''',
    '''\.env\.template$''',
    '''\.env\.test$''',
    '''\.env\.ci$''',
    '''firebase-applet-config\.json$''',
    '''firebase-config\.json$''',
    '''firebase-blueprint\.json$''',
  ]

  regexes = [
    # The single public web API key for project agape-sovereign
    # (firebase-applet-config.json). Exact-match only: a different
    # AIza... string anywhere is still a hard failure.
    '''AIzaSyAKooAY5zYjxsCrcSAXjm--a77GQ2E4u9g''',
  ]
